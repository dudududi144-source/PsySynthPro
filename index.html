<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12141a">
<title>PsySynthPro - Real DSP Synthesizer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/synth.css">
</head>
<body>
<div class="chassis">
  <div class="cheek l"></div><div class="cheek r"></div>
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="topbar">
    <button id="bPower" class="tbtn power">&#9211; POWER</button>
    <div class="oled">
      <div class="pname" id="oName">PSYSYNTH PRO</div>
      <canvas id="scope" width="520" height="54"></canvas>
      <div class="meta" id="oMeta">AUDIO-WORKLET<br>STANDBY</div>
    </div>
    <button id="bPrev" class="tbtn">&#9664;</button>
    <button id="bNext" class="tbtn">&#9654;</button>
    <button id="bRec" class="tbtn rec">&#9679; REC</button>
    <button id="bMidi" class="tbtn midi">&#9836; MIDI</button>
    <button id="bPanic" class="tbtn panic">PANIC</button>
  </div>

  <div class="viz3d-bezel">
    <div class="viz3d-label">SPECTRUM 3D</div>
    <canvas id="viz3d" width="1100" height="180"></canvas>
  </div>

  <div class="midi-row">
    <div class="midi-strip" id="midiStrip">MIDI &#9675; press POWER to enable</div>
    <div class="midi-event" id="midiEvent"></div>
  </div>

  <div class="sections" id="sections"></div>
  <div class="prow" id="presets"></div>
  <div class="kb" id="kb"></div>
  <div class="brand">PSYSYNTH PRO<span>POLYBLEP &bull; WAVETABLE &bull; ZDF SVF &bull; FM &bull; MORPH &bull; MIDI/MPE &bull; STEP SEQ &bull; ARPEGGIATOR &bull; WAV/MIDI EXPORT &bull; OFFLINE PWA</span></div>
</div>
<script>
/* Boot watchdog — surfaces failures instead of a blank panel, one-click self-heal */
window.__psyErrors = [];
window.addEventListener('error', function (e) {
  window.__psyErrors.push((e.message || 'script error') + ' @ ' + (e.filename || 'unknown'));
});
window.addEventListener('load', function () {
  setTimeout(function () {
    var s = document.getElementById('sections');
    if (!s || s.children.length > 0 || window.__psyUiReady) return;
    var d = document.createElement('div');
    d.style.cssText = 'margin:14px 0;padding:16px 18px;border:1px solid #f85149;border-radius:10px;background:#1a0b0b;color:#ffb3ab;font-family:monospace;font-size:12px;line-height:1.9';
    var msg = '<b>PANEL FAILED TO BUILD</b> \u2014 cached files are likely stale.<br>';
    if (window.__psyErrors.length) msg += 'Captured: ' + window.__psyErrors.join(' | ').slice(0, 400) + '<br>';
    msg += '<button id="bHeal" style="margin-top:8px;padding:10px 18px;background:#f85149;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-family:monospace">REPAIR \u2014 clear cache and reload</button>';
    d.innerHTML = msg;
    s.parentNode.insertBefore(d, s);
    var b = document.getElementById('bHeal');
    if (b) b.addEventListener('click', function () {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
        }
      } catch (e) {}
      try {
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        }
      } catch (e) {}
      setTimeout(function () { location.reload(); }, 200);
    });
  }, 1500);
});
</script>
<script src="src/presets.js"></script>
<script src="src/wavetable.js"></script>
<script src="src/synth-engine.js"></script>
<script src="src/knob.js"></script>
<script src="src/arpeggiator.js"></script>
<script src="src/sequencer.js"></script>
<script src="src/midi.js"></script>
<script src="src/viz3d.js"></script>
<script src="src/recorder.js"></script>
<script src="src/midi-export.js"></script>
<script src="src/ui.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
